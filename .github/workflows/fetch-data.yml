name: Fetch D4 Game Data

# ──────────────────────────────────────────────────────────────
# Nephalem's Codex — Automated Data Pipeline
#
# DATA PRIORITY SYSTEM:
#   1. Local game file extract (Option C):
#      When Owen runs scripts/convert-game-data.py on his PC and pushes,
#      it writes data/last-game-extract.json with a timestamp.
#      This workflow respects that file — if it's < 21 days old,
#      it skips the automated scrape entirely.
#      Game file data is ground truth; no automated source can beat it.
#
#   2. Automated scrape (Option A — this workflow):
#      Runs every Monday at 6 AM UTC.
#      Tries Maxroll.gg via Selenium/headless Chrome first.
#      Falls back to d4guides.gg (server-side rendered, no Selenium needed).
#      Only runs if local game data is stale (>21 days old or missing).
#
# COMBINED BEHAVIOR:
#   Owen plays after a patch → runs convert-game-data.py → pushes → perfect data
#   Owen steps away for months → this workflow keeps data current automatically
#   Owen comes back → runs convert-game-data.py → immediately takes priority again
#
# TRIGGERS:
#   - Every Monday at 6 AM UTC (automatic)
#   - Manually: Actions → "Fetch D4 Game Data" → Run workflow
#   - On push to scripts/fetch-data.py (scraper testing)
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        required: false
        default: "auto"
        type: choice
        options: [auto, maxroll, d4guides]
      force:
        description: "Force scrape even if local game data is fresh"
        required: false
        default: "false"
        type: boolean

  push:
    paths:
      - "scripts/fetch-data.py"

jobs:
  fetch-and-commit:
    name: Scrape D4 Data & Update DB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check local game data freshness
        id: freshness
        run: |
          if [ -f "data/last-game-extract.json" ]; then
            TIMESTAMP=$(python3 -c "
          import json, sys
          from datetime import datetime, timezone
          with open('data/last-game-extract.json') as f:
              d = json.load(f)
          ts  = datetime.fromisoformat(d['timestamp'])
          age = (datetime.now(timezone.utc) - ts).days
          print(age)
          " 2>/dev/null || echo "999")
            echo "Game extract age: ${TIMESTAMP} days"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "fresh=false" >> $GITHUB_OUTPUT
              echo "→ Force flag set — ignoring freshness."
            elif [ "$TIMESTAMP" -lt 21 ]; then
              echo "fresh=true" >> $GITHUB_OUTPUT
              echo "→ Local game data is ${TIMESTAMP} days old (< 21). Skipping scrape."
            else
              echo "fresh=false" >> $GITHUB_OUTPUT
              echo "→ Local game data is ${TIMESTAMP} days old (≥ 21). Scraping needed."
            fi
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
            echo "→ No local game extract found. Scraping needed."
          fi

      - name: Skip message (when fresh)
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          echo "✅ Local game file data is current — no automated scrape needed."
          echo "   Owen can run scripts/convert-game-data.py to refresh manually."

      - name: Verify Chrome (for Maxroll Selenium scraping)
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          echo "Chrome version:"
          google-chrome --version 2>/dev/null || \
          chromium-browser --version 2>/dev/null || \
          echo "⚠️ Chrome not found — Maxroll scraping will fail, d4guides fallback will run"

      - name: Fetch D4 game data
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          ARGS="--source ${{ github.event.inputs.source || 'auto' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running: python scripts/fetch-data.py $ARGS"
          python scripts/fetch-data.py $ARGS

      - name: Check for file changes
        id: changes
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated database
        if: steps.freshness.outputs.fresh != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aspects-db.js data/aspects-raw.json
          COUNT=$(grep -c 'id:"' data/aspects-db.js 2>/dev/null || echo "?")
          DATE=$(date -u '+%Y-%m-%d')
          git commit -m "🗡️ Auto-update D4 aspects [${DATE}] — ${COUNT} entries [skip ci]"
          git push

      - name: No changes detected
        if: steps.freshness.outputs.fresh != 'true' && steps.changes.outputs.changed == 'false'
        run: echo "✅ Data already up to date — no commit needed."

      - name: Job summary
        if: always()
        run: |
          echo "## 📜 Nephalem's Codex — Data Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.freshness.outputs.fresh }}" = "true" ]; then
            echo "- ✅ **Status:** Local game file data is current — scrape skipped" >> $GITHUB_STEP_SUMMARY
          elif [ -f data/aspects-db.js ]; then
            COUNT=$(grep -c 'id:"' data/aspects-db.js 2>/dev/null || echo "?")
            echo "- ✅ **Aspects written:** ${COUNT}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **aspects-db.js not found** — scrape may have failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Date | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎮 Local game extract | $([ -f data/last-game-extract.json ] && python3 -c \"import json; d=json.load(open('data/last-game-extract.json')); print(d.get('timestamp','?')[:10])\" || echo 'None') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Live site | https://alltrueist.github.io/nephalimscodex |" >> $GITHUB_STEP_SUMMARY
